edľa bytového domu\n\nVýhody nehnuteľnosti\n- slnečný, teplý a útulný byt\n- za bytovým domom je vnútroblok, kde sú lavičky, trávnatá plocha a ihriská\n- kompletná občianska vybavenosť\n- pripravený na bývanie, voľný ihneď\n\nCena nájmu:\n- nájomné 350,- EUR/mesiac \n- energie (inkaso, FO, elektrina, internet) 250,- EUR/mesiac\n- spolu nájomné + energie + internet a TV 600,- EUR/mesiac\n- nájom je splatný mesiac vopred\n- depozit vo výške dvojmesačného nájmu (1200,- EUR) splatný pri podpise nájomnej zmluvy\n\nPozrite si 3D virtuálnu prehliadku:   https://my.matterport.com/show/?m=ex2ovDQJeHi   (skopíruj link)\n\nNájomná zmluva sa uzatvára minimálne na 1 rok.\n\nMajiteľ si vyhradzuje právo vybrať si nájomníka na základe ním stanovených kritérií.\n\nViac info: Predajca \u003cspan class=\"inline-contact\" data-index=\"1943\" data-type=\"phone\">\u003cspan class=\"inline-contact-value\">...\u003c/span>\u003c/span>   www.example.sk28:[\"$\",\"$L2e\",null,{\"advertisement\":{\"id\":\"Ju6N94zLBPM\",\"title\":\"NA PRENÁJOM Prerobený, zariadený 2-izb. byt s balkónom, ul. Podjavorinskej, Poprad\",\"isActive\":true,\"sefName\":\"na-prenajom-prerobeny-zariadeny-2-izb-byt-s-balkonom-ul-podjavorinskej-poprad\",\"description\":\"$2f\",\"createdAt\":\"2026-11-10T19:10:56.942Z\",\"updatedAt\":\"2026-11-16T14:37:04.351Z\",\"publishedAt\":\"2026-11-12T13:42:09.000Z\",\"media\":{\"photos\":[{\"info\":{\"width\":4388,\"height\":2971},\"origUrl\":\"https://img.unitedclassifieds.sk/foto/ZmlsdGVyczpmb3JtYXQod2VicCkvanVs/Yw6uhrX39_fss?st=LVUyk8OFrKX670ZH9A_821Y6-DBPQc7xveIXY0adb88&ts=1794343153&e=0\",\"largeUrl\":\"https://img.unitedclassifieds.sk/foto/Zml0LWluLzE1NjB4NDAwMC9maWx0ZXJzOnF1YWxpdHkoODApOmZvcm1hdCh3ZWJwKS9qdWw=/Yw6uhrX39_fss?st=3TWn9WhoWwlN0pzSyrvGRefkT3is9MVZOMGIP7AZdLU&ts=1794343153&e=0\",\"mediumUrl\":\"https://img.unitedclassifieds.sk/foto/Zml0LWluLzc4MHgyMDAwL2ZpbHRlcnM6cXVhbGl0eSg4MCk6Zm9ybWF0KHdlYnApL2p1bA==/Yw6uhrX39_fss?st=lPAcqpQxH8xqp9z7MrJYG8T9fcORDocn6RB0jwQMBSM&ts
